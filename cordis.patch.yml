# tool-slice bundle patch.
#
# Two rows:
#   tool-slice        — Host plugin: the per-profile tool mask and its browser page.
#   preset-plan-act   — the "plan-act" Agent preset: core tools plus the
#                       plan_write (plan) → step_run (act) workflow, for local
#                       small models (e.g. 9B) that cannot afford the standard
#                       prompt and over-think when a turn is too big.
#
# The standard preset is untouched, so nothing here changes existing Sessions.

- insert:
    - id: tool-slice
      name: '@local/dsh-tool-slice'

    - id: preset-plan-act
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: plan-act
        name: plan-act
        description: 先多轮讨论把任务拆成小步计划（plan），再一步一步执行（act），每步交给独立子代理，让 9B 这类小模型一次只做一件小事，避免长篇大思考。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent powered by the {{model}} model.
                默认用中文回答。
                一次只推进一小步：复杂任务先 plan_write 拆成小步，再 step_run 一步步做，不要一次全做完。
                输出要短：只给结论和关键事实，不要长篇推理，不要复述任务或工具原文。
                动手前先查证：用 read / grep / glob 看清现状再改，不要凭记忆猜代码。
                改动尽量小，沿用仓库已有写法；不要顺手重构无关代码。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              # Required by the plugin's schema; false keeps glob output verbatim
              # instead of sampling it, so a small model sees exactly what matched.
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              # Required by the plugin's schema.
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # plan-act: plan_write (plan) + step_run (act) and their prompt
          # section. It lives in the preset, so only Sessions on this preset pay
          # for it.
          - id: step-tools
            name: '@local/dsh-tool-slice/step-tools'

          # Compact earlier than standard too: a 64k window on a 9B model
          # degrades long before it is full.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 768